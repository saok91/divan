<style>
/* ============================================================
   DIRECTION A — «کنسول متراکم» (dense console)
   رنگ‌های استفاده‌شده / HEX INVENTORY
   ------------------------------------------------------------
   BRAND (locked, shared across all directions)
   #051061  navy — چرم ثابت: هدر و نوار کناری (light)
   #030825  navy dark — چرم در تم تاریک
   #FFFFFF  white — فورگراند چرم، سطح جدول
   #FDB913  gold — دکمهٔ اصلی (CTA)
   #1A1208  gold-foreground — متن روی طلایی
   #FBC470  gold dark-theme — طلایی تم تاریک
   #006FFF  blue — ساختار/ثانویه، حلقهٔ فوکوس
   #808184  muted brand — متن خاموش برند

   STATUS BADGE PAIRS (locked)
   #E7F5FF / #1864AB   زمان‌بندی‌شده (scheduled)
   #D3F9D8 / #2B8A3E   اثرگذار (effective)
   #F1F3F5 / #495057   لغوشده (cancelled)
   #FFF9DB / #E67700   پیش‌نویس (draft)
   #FFF3BF / #862E00   بازنویسی (override)

   STALE BANNER (locked)
   #FFF3BF bg / #862E00 fg / #FDB913 border

   DIRECTION-A NEUTRALS (this direction's own choice: hairlines, no boxes)
   #F4F5F8  page backdrop پشت قاب‌های ماکت
   #FFFFFF  surface — سطح اصلی محتوا
   #FAFBFC  subtle surface — نوار ابزار و سرستون
   #E8EAEF  hairline — خط جداکنندهٔ مویی بین ردیف‌ها
   #DCDFE7  hairline strong — مرز نوار ابزار و سرستون
   #D2D5DF  control border — مرز دکمه‌های اقدام ردیف
   #11142A  text primary
   #4A4F63  text secondary
   #8A8F9E  text tertiary / placeholder
   #F2F4F8  row hover
   #EEF1F6  kbd chip bg
   #E9EAF0  skeleton block
   #EAF3FF  blue tint — پس‌زمینهٔ تراشهٔ فیلتر فعال
   #C7DEFF  blue tint border
   #F9FAFB  disabled surface
   #B8BCC8  disabled text

   DARK PARITY SNIPPET
   #030825  dark chrome / صفحه
   #0A1138  dark surface
   #131C4A  dark row hover
   #232C5E  dark border
   #E6E9F5  dark text primary
   #9AA1C0  dark text secondary
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#F4F5F8;color:#11142A;
  font-family:"Yekan Bakh Fa-En","Segoe UI",Tahoma,sans-serif;
  font-size:13px;line-height:1.55;
  font-variant-numeric:tabular-nums;
}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:13px;height:13px}

/* ---------- document (rationale) ---------- */
.doc{max-width:1400px;margin:0 auto;padding:28px 24px 8px}
.doc h1{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.doc .kicker{font-size:11px;font-weight:700;color:#006FFF;letter-spacing:.06em;margin-bottom:8px}
.doc p{margin:0 0 14px;max-width:78ch;color:#4A4F63;font-size:13.5px;line-height:1.85}
.spec{display:flex;flex-wrap:wrap;gap:0;border:1px solid #DCDFE7;background:#FFFFFF;border-radius:6px;overflow:hidden}
.spec div{padding:9px 14px;border-inline-start:1px solid #E8EAEF;flex:1 1 auto;min-width:150px}
.spec div:first-child{border-inline-start:0}
.spec dt{font-size:10.5px;color:#8A8F9E;font-weight:700;letter-spacing:.04em;margin:0 0 2px}
.spec dd{margin:0;font-size:12.5px;font-weight:600;color:#11142A}

/* ---------- browser frame mock ---------- */
.mock{max-width:1400px;margin:0 auto;padding:18px 24px 0;overflow-x:auto}
.mock-label{font-size:11.5px;font-weight:700;color:#4A4F63;margin:0 0 7px;display:flex;align-items:center;gap:8px}
.mock-label span{font-weight:500;color:#8A8F9E}
.frame{width:1280px;border:1px solid #DCDFE7;border-radius:8px;overflow:hidden;background:#FFFFFF;box-shadow:0 1px 2px rgba(5,16,97,.05)}
.frame-bar{height:32px;background:#FAFBFC;border-bottom:1px solid #E8EAEF;display:flex;align-items:center;gap:8px;padding:0 10px}
.dot{width:8px;height:8px;border-radius:50%;background:#DCDFE7}
.frame-url{margin-inline-start:8px;flex:1;height:19px;border-radius:4px;background:#FFFFFF;border:1px solid #E8EAEF;font-size:10.5px;color:#8A8F9E;display:flex;align-items:center;padding:0 8px;direction:ltr;justify-content:flex-start}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-rows:56px 1fr;height:684px;background:#FFFFFF}
.app-sm{height:auto}
.topbar{background:#051061;color:#FFFFFF;display:flex;align-items:center;padding:0 14px;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:.02em;min-width:212px}
.brand-mark{width:22px;height:22px;border-radius:4px;background:#FDB913;color:#1A1208;display:grid;place-items:center;font-size:12px;font-weight:900}
.topbar .spacer{flex:1}
.top-btn{height:30px;padding:0 9px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#FFFFFF;font:inherit;font-size:12px;display:flex;align-items:center;gap:6px}
.top-user{display:flex;align-items:center;gap:7px;font-size:12px}
.avatar{width:24px;height:24px;border-radius:50%;background:#006FFF;color:#FFFFFF;display:grid;place-items:center;font-size:11px;font-weight:700}
.body{display:grid;grid-template-columns:240px 1fr;min-height:0}
.body-collapsed{grid-template-columns:64px 1fr}
.side{background:#051061;color:#FFFFFF;padding:8px 8px 12px;overflow:auto}
.side-group{font-size:10px;color:rgba(255,255,255,.5);font-weight:700;letter-spacing:.06em;padding:10px 8px 5px}
.nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:4px;color:rgba(255,255,255,.78);font-size:12.5px;text-decoration:none;margin-bottom:1px}
.nav:hover{background:rgba(255,255,255,.07);color:#FFFFFF}
.nav.on{background:rgba(255,255,255,.13);color:#FFFFFF;font-weight:700;box-shadow:inset 2px 0 0 #FDB913}
.nav .kb{margin-inline-start:auto;font-size:9.5px;color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);border-color:transparent;font-family:inherit}
.body-collapsed .nav{justify-content:center;padding:0}
.body-collapsed .nav span.t,.body-collapsed .nav .kb,.body-collapsed .side-group{display:none}
.main{min-width:0;overflow:auto;background:#FFFFFF}

/* ---------- page header: typographic, no box ---------- */
.phead{padding:12px 16px 0}
.crumb{font-size:11px;color:#8A8F9E;margin-bottom:3px}
.ptitle{display:flex;align-items:baseline;gap:10px}
.ptitle h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.ptitle .count{font-size:12px;color:#8A8F9E;font-weight:600}
.tabs{display:flex;gap:2px;margin-top:8px;border-bottom:1px solid #E8EAEF}
.tab{padding:0 10px;height:30px;display:flex;align-items:center;font-size:12.5px;color:#4A4F63;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.tab.on{color:#11142A;font-weight:700;border-bottom-color:#051061}

/* ---------- banner stack ---------- */
.banners{padding:10px 16px 0}
.banner{background:#FFF3BF;color:#862E00;border:1px solid #FDB913;border-radius:4px;padding:7px 10px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.7}
.banner .bi{margin-top:2px}
details.more{display:inline}
details.more summary{display:inline;cursor:pointer;color:#862E00;font-weight:700;text-decoration:underline;text-underline-offset:2px}
details.more summary::-webkit-details-marker{display:none}
details.more p{margin:5px 0 0;font-size:12px;color:#862E00;opacity:.92;max-width:82ch}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:6px;padding:9px 16px;flex-wrap:wrap}
.btn{height:28px;padding:0 10px;border-radius:6px;border:1px solid #D2D5DF;background:#FFFFFF;color:#11142A;font:inherit;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F2F4F8}
.btn-gold{height:32px;background:#FDB913;border-color:#FDB913;color:#1A1208;font-weight:800}
.btn-blue{background:#006FFF;border-color:#006FFF;color:#FFFFFF;font-weight:700}
.btn-ghost{border-color:transparent;background:transparent;color:#4A4F63}
.btn[disabled]{background:#F9FAFB;border-color:#E8EAEF;color:#B8BCC8;cursor:not-allowed}
.kb{font-size:10px;font-weight:700;color:#8A8F9E;background:#EEF1F6;border:1px solid #E8EAEF;border-radius:3px;padding:0 4px;line-height:15px;display:inline-block;min-width:16px;text-align:center}
.btn .kb{background:rgba(0,0,0,.06);border-color:transparent}
.search{height:28px;flex:0 1 240px;display:flex;align-items:center;gap:6px;border:1px solid #D2D5DF;border-radius:4px;padding:0 8px;color:#8A8F9E;font-size:12.5px;background:#FFFFFF}
.chip{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 4px;border-radius:4px;background:#EAF3FF;border:1px solid #C7DEFF;color:#1864AB;font-size:11.5px;font-weight:700}
.chip b{font-weight:800}
.chip .x{width:15px;height:15px;border-radius:3px;display:grid;place-items:center;color:#1864AB;cursor:pointer}
.chip .x:hover{background:#C7DEFF}
.tb-spacer{flex:1}
.tb-meta{font-size:11.5px;color:#8A8F9E;font-weight:600}

/* ---------- table: hairlines, no zebra, no card ---------- */
.tbl-wrap{overflow:auto;border-top:1px solid #DCDFE7;max-height:352px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:3;background:#FAFBFC;color:#4A4F63;
  font-size:10.5px;font-weight:800;letter-spacing:.03em;text-align:start;
  height:28px;padding:0 6px;white-space:nowrap;border-bottom:1px solid #DCDFE7;
}
tbody td{height:32px;padding:0 6px;border-bottom:1px solid #E8EAEF;white-space:nowrap;background:#FFFFFF;vertical-align:middle}
tbody tr:hover td{background:#F2F4F8}
td.num,th.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.name{font-weight:700;color:#11142A}
.trunc{max-width:104px;overflow:hidden;text-overflow:ellipsis;display:block}
.trunc-team{max-width:112px;overflow:hidden;text-overflow:ellipsis;display:block}
tr.ended td{color:#8A8F9E}
tr.ended .name{color:#4A4F63;font-weight:600}

/* sticky identifier column at inline-start */
th.c-id,td.c-id{position:sticky;inset-inline-start:0;z-index:2;box-shadow:inset -1px 0 0 #E8EAEF}
thead th.c-id{z-index:4}
/* sticky actions column at inline-end */
th.c-act,td.c-act{position:sticky;inset-inline-end:0;z-index:2;box-shadow:inset 1px 0 0 #DCDFE7;padding-inline:6px}
thead th.c-act{z-index:4}
tr:hover td.c-id,tr:hover td.c-act{background:#F2F4F8}

/* Direction A row-action affordance: compact OUTLINED icon+label, 24px, always bordered */
.rowacts{display:flex;gap:3px;align-items:center}
.ra{
  height:24px;padding:0 5px;border-radius:4px;
  border:1px solid #D2D5DF;background:#FFFFFF;color:#11142A;
  font:inherit;font-size:10.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap;
}
.ra .ic-sm{width:12px;height:12px}
/* icon-only marker used inside the dense table when an action is blocked; full reason text lives in the states panel */
.ra-flag{width:22px;height:22px;border-radius:4px;background:#FFF3BF;border:1px solid #FDB913;color:#862E00;display:inline-grid;place-items:center;flex:none}
.ra:hover{background:#F2F4F8;border-color:#8A8F9E}
.ra-blue{color:#006FFF;border-color:#C7DEFF}
.ra-blue:hover{background:#EAF3FF;border-color:#006FFF}
.ra[disabled]{background:#F9FAFB;border-color:#E8EAEF;color:#B8BCC8;cursor:not-allowed}
.ra-reason{font-size:10.5px;color:#862E00;background:#FFF3BF;border:1px solid #FDB913;border-radius:3px;padding:0 5px;line-height:17px;white-space:nowrap}

.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700}
.b-yes{background:#D3F9D8;color:#2B8A3E}
.b-no{background:#F1F3F5;color:#495057}
.b-sched{background:#E7F5FF;color:#1864AB}
.b-draft{background:#FFF9DB;color:#E67700}

/* ---------- states ---------- */
.state-strip{display:grid;grid-template-columns:1fr;gap:0}
.state-block{padding:0}
.state-head{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#FAFBFC;border-bottom:1px solid #E8EAEF;border-top:1px solid #DCDFE7}
.state-head h3{margin:0;font-size:12px;font-weight:800}
.state-head span{font-size:11px;color:#8A8F9E}
.empty{padding:34px 16px;text-align:center}
.empty .mark{width:30px;height:30px;border-radius:6px;border:1px solid #DCDFE7;display:inline-grid;place-items:center;color:#8A8F9E;margin-bottom:9px}
.empty p{margin:0 0 11px;font-size:13px;color:#4A4F63;font-weight:600}
@keyframes pulseA{0%,100%{opacity:.5}50%{opacity:1}}
.sk{display:block;height:8px;border-radius:3px;background:#E9EAF0;animation:pulseA 1.5s ease-in-out infinite}
.sk-btn{height:24px;border-radius:4px;background:#E9EAF0;animation:pulseA 1.5s ease-in-out infinite}

/* ---------- form (screen 3) ---------- */
.form-wrap{padding:12px 16px 18px;max-width:1120px}
.fsec{border-top:1px solid #E8EAEF;padding:11px 0 13px;display:grid;grid-template-columns:168px 1fr;gap:16px}
.fsec:first-of-type{border-top:0}
.fsec-h h4{margin:0;font-size:12.5px;font-weight:800}
.fsec-h p{margin:2px 0 0;font-size:11.5px;color:#8A8F9E;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.f label{display:block;font-size:11px;font-weight:700;color:#4A4F63;margin-bottom:3px}
.inp{height:32px;border:1px solid #D2D5DF;border-radius:4px;background:#FFFFFF;padding:0 8px;font-size:12.5px;display:flex;align-items:center;gap:6px;color:#11142A}
.inp.focus{border-color:#006FFF;box-shadow:0 0 0 2px rgba(0,111,255,.18)}
.inp .ph{color:#8A8F9E}
.inp .cursor{width:1px;height:15px;background:#11142A;display:inline-block}
.inp.off{background:#F9FAFB;color:#B8BCC8;border-color:#E8EAEF}
.hint{font-size:10.5px;color:#8A8F9E;margin-top:3px}
.picker{position:relative}
.pop{
  position:absolute;inset-inline-start:0;inset-inline-end:0;top:calc(100% + 3px);z-index:9;
  background:#FFFFFF;border:1px solid #D2D5DF;border-radius:4px;box-shadow:0 6px 18px rgba(5,16,97,.13);overflow:hidden;
}
.pop-h{padding:5px 9px;font-size:10.5px;color:#8A8F9E;font-weight:700;border-bottom:1px solid #E8EAEF;background:#FAFBFC;display:flex;justify-content:space-between}
.opt{padding:5px 9px;border-bottom:1px solid #F2F4F8;cursor:pointer}
.opt:last-child{border-bottom:0}
.opt.on{background:#EAF3FF;box-shadow:inset 2px 0 0 #006FFF}
.opt .l1{font-size:12.5px;font-weight:700;color:#11142A}
.opt .l1 .code{color:#006FFF;font-weight:800}
.opt .l2{font-size:11px;color:#8A8F9E}
.pop-f{padding:4px 9px;font-size:10.5px;color:#8A8F9E;background:#FAFBFC;border-top:1px solid #E8EAEF;display:flex;gap:10px}
.token{height:24px;display:inline-flex;align-items:center;gap:6px;padding:0 5px 0 3px;border-radius:4px;background:#EAF3FF;border:1px solid #C7DEFF;color:#11142A;font-size:11.5px;font-weight:700}
.token .code{color:#006FFF;font-weight:800}
.token .x{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;color:#4A4F63;cursor:pointer}
.token .x:hover{background:#C7DEFF}
details.tech{border:1px solid #E8EAEF;border-radius:4px;background:#FAFBFC;margin-top:2px}
details.tech summary{list-style:none;cursor:pointer;padding:6px 9px;font-size:11.5px;font-weight:700;color:#4A4F63;display:flex;align-items:center;gap:6px}
details.tech summary::-webkit-details-marker{display:none}
details.tech .tech-body{padding:0 9px 8px;display:flex;align-items:center;gap:8px}
.uuid{direction:ltr;font-family:"Segoe UI",Tahoma,monospace;font-size:11px;background:#FFFFFF;border:1px solid #E8EAEF;border-radius:3px;padding:3px 7px;color:#4A4F63;user-select:all}
.cap{display:flex;gap:0;border:1px solid #E8EAEF;border-radius:4px;overflow:hidden;max-width:340px}
.cap div{flex:1;padding:6px 10px;border-inline-start:1px solid #E8EAEF}
.cap div:first-child{border-inline-start:0}
.cap dt{font-size:10.5px;color:#8A8F9E;font-weight:700;margin:0}
.cap dd{margin:0;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.cap .free dd{color:#2B8A3E}
.cap .res dd{color:#E67700}
.fbar{position:sticky;bottom:0;background:#FFFFFF;border-top:1px solid #DCDFE7;padding:9px 16px;display:flex;align-items:center;gap:8px}
.fbar .sp{flex:1}
.fbar .note{font-size:11px;color:#8A8F9E}

/* ---------- dark parity snippet ---------- */
.dark{background:#030825;border-radius:8px;padding:0;overflow:hidden;border:1px solid #232C5E}
.dark .dhead{background:#030825;color:#9AA1C0;padding:8px 12px;font-size:11px;font-weight:700;border-bottom:1px solid #232C5E}
.dark table{color:#E6E9F5}
.dark thead th{background:#0A1138;color:#9AA1C0;border-bottom:1px solid #232C5E}
.dark tbody td{background:#030825;border-bottom:1px solid #232C5E;color:#E6E9F5}
.dark tbody tr:hover td{background:#131C4A}
.dark .ra{background:#0A1138;border-color:#232C5E;color:#E6E9F5}
.dark .ra-blue{color:#FBC470;border-color:#5A4620}
.dark .btn-gold{background:#FBC470;border-color:#FBC470;color:#1A1208}
.dark .b-yes{background:#123722;color:#8CE0A6}
.foot{max-width:1400px;margin:0 auto;padding:14px 24px 40px;color:#8A8F9E;font-size:11.5px}
</style>
