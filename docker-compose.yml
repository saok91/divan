# Local/dev PostgreSQL only — not for production sizing/HA.
# If host port 5432 is taken: POSTGRES_PORT=5433 pnpm db:up
services:
  postgres:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: divan
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - divan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d divan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  divan_pg_data:
